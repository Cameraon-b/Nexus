# REVIEW EXAMPLE ONLY. Not installed on Nora; no real certificate paths or keys.
# The host proxy reaches only the loopback-published frontend, never API/Postgres.
server {
    listen 80;
    server_name nexus.aether.lab;
    return 308 https://nexus.aether.lab$request_uri;
}
server {
    listen 443 ssl;
    server_name nexus.aether.lab;
    ssl_certificate /REPLACE/WITH/FULLCHAIN.pem;
    ssl_certificate_key /REPLACE/WITH/PRIVATEKEY.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host nexus.aether.lab;
        proxy_set_header X-Forwarded-Proto https;
        # Replace, never append untrusted incoming forwarding headers.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
